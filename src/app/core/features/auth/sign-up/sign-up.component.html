<div class="flex justify-center items-center min-h-[60vh]">
  <form
    class="bg-white p-8 rounded-lg shadow-md min-w-[320px] flex flex-col gap-6"
  >
    <h2 class="text-2xl font-semibold text-center mb-2">Sign Up</h2>
    <div class="flex flex-col gap-2">
      <label for="email" class="font-medium"> Email </label>

      <input
        id="email"
        name="email"
        type="email"
        placeholder="Enter your email"
        required
        class="py-2 px-3 w-full border border-gray-300 rounded focus:border-emerald-500 focus:outline-none"
      />
    </div>
    <div nz-form-item class="flex flex-col gap-2">
      <label for="password" class="font-medium"> Password </label>
      <nz-form-control>
        <input
          id="password"
          name="password"
          type="password"
          placeholder="Enter your password"
          required
          class="py-2 px-3 w-full border border-gray-300 rounded focus:border-emerald-500 focus:outline-none"
        />
      </nz-form-control>
    </div>
    <div nz-form-item class="flex flex-col gap-2">
      <label for="confirmPassword" class="font-medium">
        Confirm Password
      </label>
      <input
        id="confirmPassword"
        name="confirmPassword"
        type="password"
        placeholder="Confirm your password"
        required
        class="py-2 px-3 w-full border border-gray-300 rounded focus:border-emerald-500 focus:outline-none"
      />
    </div>
    <div class="text-sm">
      Already have an account?
      <a routerLink="/auth/sign-in" class="text-emerald-600 hover:underline">
        Sign In
      </a>
    </div>
    <button
      type="submit"
      class="bg-emerald-800 hover:bg-emerald-900 font-medium py-2 rounded mt-2"
    >
      <span class="text-slate-200"> Create Account </span>
    </button>
  </form>
</div>
